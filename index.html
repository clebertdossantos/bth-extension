<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div class="div">
        <header class="hd">Utilitários Contábil Cloud</header>
        <input id="chaveAcesso" class="input" type="text" placeholder="Chave de Acesso (Token Service Layer)">
        <button id="btn-chave" type="button" class="button">Acessa chave</button>
        <input id="consultaExecucao" class="input" type="text" placeholder="Consulta Extensões Plataforma">
        <button id="btn-proto" type="button" class="button">Consulta protocolo</button>
        <button id="btnContext" type="button" class="btnContext">Dados Entidade</button>
        <div class="atalhos-section">
            <p class="atalhos-title">ATALHOS</p>
            <div id="dbtn">
                <button id="btncontabil" title="Swagger Contábil" type="button" class="btnSwagger">Contábil</button>
                <button id="btnplanejamento" title="Swagger Planejamento" type="button" class="btnSwagger">Planejamento</button>
                <button id="btntesouraria" title="Swagger Tesouraria" type="button" class="btnSwagger">Tesouraria</button>
                <button id="btnescsaldoinicial" title="Saldo Inicial" type="button" class="btnSwagger">Escritura saldos iniciais</button>
                <button id="btnsaldoinicial" title="Saldo Inicial" type="button" class="btnSwagger">Excluir saldos iniciais</button>
                <button id="btnjiraconclusao" title="Tramitação Jira" type="button" class="btnSwagger">Chamado JIRA</button>
            </div>
        </div>
    </div>
    <script src="./src/main.js"></script>
</body>
</html>
